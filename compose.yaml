services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-teza}
      POSTGRES_USER: ${POSTGRES_USER:-teza}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20
  backend:
    build: .
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-teza}
      POSTGRES_USER: ${POSTGRES_USER:-teza}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      EDITOR_USERNAME: ${EDITOR_USERNAME:-editor}
      EDITOR_PASSWORD: ${EDITOR_PASSWORD:?Set EDITOR_PASSWORD in .env}
    ports:
      - "127.0.0.1:${SERVER_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres-data:
